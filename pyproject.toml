[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meshprovision"
version = "0.1.0"
description = "Provisioning and read-only monitoring toolkit for Meshtastic mesh nodes."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "meshprovision contributors" }]
keywords = ["meshtastic", "lora", "mesh", "provisioning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Ham Radio",
  "Typing :: Typed",
]
dependencies = [
  # Pinned to a specific commit on meshtastic/python's unreleased master
  # branch (not an official PyPI release -- 2.7.11 is still latest there):
  # the tip carrying protobufs v2.8.1 (2026-10-03), originally pinned
  # specifically to get SecurityConfig.packet_signature_policy, a firmware
  # 2.8 protobuf field not in any tagged release yet. See
  # ~/.claude/projects/-home-claude-meshprovision/memory/firmware_28_compatibility.md
  # for why, and re-evaluate once an official 2.8-compatible release lands.
  "meshtastic @ git+https://github.com/meshtastic/python.git@0a1835760c2437314a2d3544bbdd8b6fead559bc",
  # Lower bounds are the oldest releases the test suite passes on (round
  # 65, measured on Python 3.11): click 8.2 for the CLI tests, httpx 0.25
  # (the first on httpcore 1); the others with every test passing at that
  # version. pydantic 2.8 is the first that runs on Python 3.13 (older
  # pydantic-core wheels stop at 3.12).
  "cryptography>=38.0.4",
  "pydantic>=2.8",
  "rich>=13.3.1",
  "click>=8.2",
  "structlog>=22.1",
  "httpx>=0.25",
  "odfpy>=1.4.1",
  "python-dotenv>=0.21",
  "platformdirs>=2.6.2",
  # Imported directly by this package, not just pulled in by meshtastic:
  # yaml (config/template.py, provisioning/backup_parse.py), google.protobuf
  # (provisioning/backup_parse.py, device_write.py, detect.py) and serial.tools
  # (provisioning/discovery.py). PyYAML's and pyserial's bounds match
  # meshtastic's own so pip has one interval to satisfy. protobuf's is
  # tighter than meshtastic's >=4.21.12: detect.py reads
  # FieldDescriptor.is_repeated, which is False for every field before 6.31,
  # so every live configuration read would fail on an older protobuf.
  "PyYAML>=6.0.1,<7",
  "protobuf>=6.31",
  "pyserial>=3.5,<4",
  # Imported directly by db/ods_read.py, which checks every ODF part with it
  # before odfpy loads the file; also odfpy's own XML parser.
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Documented alias only: meshtastic>=2.7.11 already depends on bleak directly,
# so BLE works without this extra. Kept so `pip install "meshprovision[ble]"`
# stays a valid, non-broken command.
ble = ["meshtastic>=2.7.11"]
dev = [
  "pytest",
  "pytest-cov",
  "respx",
  "responses",
  # Pinned so CI (which installs this extra) and pre-commit run the same
  # checks: ruff as .pre-commit-config.yaml's ruff-pre-commit rev, mypy to
  # one minor release. Bump them together, deliberately.
  "ruff==0.16.4",
  "mypy>=2.3,<2.5",
  # PyYAML and protobuf (declared above, in [project.dependencies]) ship no
  # `py.typed` marker, so `mypy --strict` needs a stub package for each or it
  # fails `import-untyped` on `config/template.py`, `provisioning/backup_parse.py`,
  # `provisioning/device_write.py`, and `provisioning/detect.py`. pyserial needs no
  # stub: `[[tool.mypy.overrides]]` below already sets
  # ignore_missing_imports for `serial.*`.
  "types-PyYAML",
  "types-protobuf",
  "pre-commit",
  "detect-secrets",
  "build",
  "twine",
]
# Everything above, in one shot: `pip install -e ".[all]"`. Self-referential
# extra (PEP 621, pip >= 21.2) -- update this list if a new extra is ever added.
all = ["meshprovision[ble,dev]"]

[project.scripts]
mesh = "meshprovision.cli.main:cli"

[tool.hatch.metadata]
# Required for the pinned meshtastic git-commit dependency above (a direct
# reference). This project is not published to PyPI (an internal tool), so
# PyPI's own prohibition on direct references in an uploaded package's
# metadata doesn't apply here.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/meshprovision"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "config",
  "scripts",
  "docs",
  "data/known_bad_keys.txt",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "DTZ", "T20", "S", "ANN", "D", "RUF"]
ignore = [
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "ANN401",  # typing.Any is occasionally unavoidable at protobuf boundaries
  "S603",    # subprocess calls are audited individually
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "ANN001", "ANN201", "ARG001"]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["meshprovision"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["meshtastic.*", "odf.*", "defusedxml.*", "serial.*", "bleak.*", "responses.*", "pubsub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A warning is a failure, so a deprecation shows up the day it starts.
filterwarnings = ["error"]
markers = [
  "unit: fast, pure-logic tests with no I/O",
  "e2e: end-to-end CLI tests against a fully mocked environment",
]

[tool.coverage.run]
source = ["src/meshprovision"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  # A Protocol method's or overload's body.
  "^\\s*\\.\\.\\.$",
]
