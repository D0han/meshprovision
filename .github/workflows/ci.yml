name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # This project uses pip + `python -m build`, not uv, in CI. The build
  # backend is hatchling>=1.27; there is no uv.lock, no [tool.uv] table, and
  # no PEP 735 [dependency-groups] table — dev dependencies live in
  # [project.optional-dependencies].dev, which `pip install -e ".[dev]"`
  # resolves natively. uv works on a developer machine, but CI
  # intentionally does not require it to be installed.
  quality:
    name: quality (py${{ matrix.python-version }})
    # Pinned: ubuntu-latest moved to 26.04; bump the image on purpose.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev]"

      - name: pip-audit
        # Known advisories in the installed dependency tree. setuptools is
        # not a dependency, but the runner's copy sits in this environment,
        # so the Install step upgrades it past its fixed releases. The editable
        # project itself is skipped; meshtastic is checked as the release
        # its metadata names, not as the pinned commit.
        run: |
          pip install pip-audit==2.10.1
          pip-audit --skip-editable

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src

      - name: detect-secrets
        # The pre-commit hook itself, so the rev (v1.5.0) and the
        # exclusions stay the ones .pre-commit-config.yaml pins, run over
        # every tracked file. A false positive takes an inline
        # `pragma: allowlist secret` comment, never a wider exclusion.
        run: pre-commit run detect-secrets --all-files

      - name: pytest
        # `pytest` is invoked bare, not `python -m pytest`: pyproject's
        # [tool.pytest.ini_options] already supplies testpaths, -ra,
        # --strict-markers, --strict-config, and the unit/e2e markers.
        #
        # `--cov` with no value picks up [tool.coverage.run] source =
        # ["src/meshprovision"] from pyproject.toml. [tool.coverage.report]
        # fail_under = 97 already enforces the floor; --cov-fail-under=97 is
        # passed anyway so the floor is visible directly in the CI log and in
        # this file.
        #
        # Deliberately not setting MESHPROVISION_CONTACT or any other
        # MESHPROVISION_* variable here: tests/conftest.py's autouse
        # _isolated_cwd_and_env fixture strips every MESHPROVISION_* variable
        # and chdirs into tmp_path, so setting one in the job env would be
        # dead weight at best and could mask a real settings-layering bug.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=97

  package:
    name: package build
    # Pinned: ubuntu-latest moved to 26.04; bump the image on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check dist/*

      - name: Smoke-test the built wheel in a clean environment
        # The point of this job: prove the single console script
        # `mesh = "meshprovision.cli.main:cli"` is actually installed and
        # that all eleven subcommands register, from a built wheel
        # rather than from an editable install.
        #
        # `mesh --help` (and each subcommand's --help) is side-effect free by
        # design — the group callback only builds Settings and configures
        # logging, it never opens the DB, loads the template, or hits the
        # network — so no config files are needed for this step.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/mesh --version
          /tmp/smoke/bin/mesh --help
          /tmp/smoke/bin/mesh provision --help
          /tmp/smoke/bin/mesh adopt --help
          /tmp/smoke/bin/mesh status --help
          /tmp/smoke/bin/mesh health --help
          /tmp/smoke/bin/mesh network --help
          /tmp/smoke/bin/mesh remote --help
          /tmp/smoke/bin/mesh admin --help
          /tmp/smoke/bin/mesh db --help
          /tmp/smoke/bin/mesh template --help
          /tmp/smoke/bin/mesh init --help
          /tmp/smoke/bin/mesh peers --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
