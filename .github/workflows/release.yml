name: Release

# Publishing does not wait for ci.yml: run it green on the tagged commit
# first. The artifacts carry a SHA256SUMS file; build tools are pinned.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build artifacts
    # Pinned: ubuntu-latest moved to 26.04; bump the image on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        # tomllib is stdlib from Python 3.11 onward, so this guard needs no
        # extra dependency. `if: startsWith(...)` lets a manual
        # workflow_dispatch run skip the guard.
        #
        # The ref name is read from the GITHUB_REF_NAME environment variable
        # inside the quoted heredoc (<<'PY'), never interpolated directly
        # into the Python source via ${{ }} — interpolating a ref name
        # straight into a script body is a script-injection risk.
        run: |
          python - <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as fh:
              project_version = tomllib.load(fh)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != project_version:
              sys.exit(f"Tag {tag!r} does not match pyproject version {project_version!r}")
          print(f"Tag and pyproject agree on version {project_version}")
          PY

      - name: Build and check
        run: |
          python -m pip install --upgrade pip
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check dist/*
          (cd dist && sha256sum -- * > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: github release
    needs: build
    # Pinned: ubuntu-latest moved to 26.04; bump the image on purpose.
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    # Scoped to this job only; the workflow-level default above stays
    # `contents: read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Tell whether the tag is a pre-release
        id: kind
        # A PEP 440 pre-release (aN, bN, rcN) or development release
        # (.devN, alone or after the others), as the tag guard in the build
        # job makes the tag the pyproject version. A post-release (.postN)
        # is a full release, so it is not marked.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ && "$TAG" =~ (a|b|rc)[0-9]+|\.dev[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}

  # OPTIONAL, DISABLED BY DEFAULT — PyPI publish.
  #
  # meshprovision is not published to PyPI. Uncomment this job only after you
  # have (1) claimed the `meshprovision` name on PyPI, (2) configured a PyPI
  # Trusted Publisher for this repository and this workflow filename, and
  # (3) created a GitHub environment named `pypi`. Trusted Publishing is used
  # deliberately: it needs no long-lived PYPI_API_TOKEN secret in the repo.
  # Note the distribution name is `meshprovision`; only the console script is
  # named `mesh`, so this does not collide with the unrelated abandoned
  # `mesh` distribution on PyPI.
  #
  # PyPI refuses a package whose metadata holds a direct reference, so first
  # replace the `meshtastic @ git+...` pin in pyproject.toml with a released
  # version that has what the pin is for, and pin the two actions below to
  # full commit SHAs like every other step (tests/unit/test_ci_workflows.py
  # checks only the active jobs).
  #
  # publish-pypi:
  #   name: publish to PyPI
  #   needs: build
  #   runs-on: ubuntu-24.04
  #   if: startsWith(github.ref, 'refs/tags/')
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist
  #     - uses: pypa/gh-action-pypi-publish@release/v1
